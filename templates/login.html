<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — InsightForge AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo">InsightForge AI</div>
        <div class="tagline">Transform Information into Intelligence.</div>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Log in to continue your research.</p>

      <div class="auth-error" id="auth-error"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember" style="margin:0;">Remember me</label>
        </div>

        <button type="submit" class="auth-submit">Log In</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="{{ url_for('auth.register_page') }}">Create one</a>
      </p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
